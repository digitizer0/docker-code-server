name: Sync upstream & rebase rust branch

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch: # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/${{ github.repository }}.git

      - name: Add upstream remote
        run: git remote add upstream https://github.com/linuxserver/docker-code-server.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if upstream master has new commits
        id: check
        run: |
          LOCAL=$(git rev-parse origin/master)
          UPSTREAM=$(git rev-parse upstream/master)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "No new commits on upstream master."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream master is ahead, syncing..."
          fi

      - name: Sync master with upstream
        run: |
          git checkout -B master origin/master
          git merge --ff-only upstream/master
          git push origin master

      - name: Merge master into rust
        run: |
          git checkout rust
          # Gate on rust itself, so a failed run is retried next time
          if git merge-base --is-ancestor origin/master rust; then
            echo "rust is current"; exit 0
          fi

          git merge --no-edit origin/master || {
            # Workflows deliberately removed on rust: keep them deleted
            for f in $(git diff --name-only --diff-filter=U -- .github/workflows); do
              git rm -q -f "$f"
            done
            # Generated/bot files: take upstream's version
            for f in package_versions.txt README.md readme-vars.yml jenkins-vars.yml Jenkinsfile; do
              git checkout --theirs -- "$f" 2>/dev/null && git add "$f" || true
            done
            # Anything left (Dockerfile, s6 run script) is a real conflict: fail loudly
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Manual conflict resolution needed"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          }
          git push origin rust
